name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Each job mirrors one part of `just ci` and calls its tool directly, so a
# failure names the check that broke.
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v4
      - run: bun install --frozen-lockfile
      - run: bun run oxfmt --check
      - run: just --fmt --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run svelte-kit sync
      - run: bun run svelte-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run svelte-kit sync
      - run: bun run eslint --max-warnings 0

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --bun vite build
      - run: bun run scripts/check-embeds.ts
